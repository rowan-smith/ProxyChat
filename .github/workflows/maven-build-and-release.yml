name: Maven Build and Release

on:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Extract artifact version
        run: echo "RELEASE_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Build and test with Maven
        run: mvn -B verify --file pom.xml

      - name: Prepare release assets
        run: |
          BUNGEE_JAR="bungee/target/ProxyChat-Bungee-${RELEASE_VERSION}.jar"
          VELOCITY_JAR="velocity/target/ProxyChat-Velocity-${RELEASE_VERSION}.jar"

          test -f "$BUNGEE_JAR" || (echo "Missing $BUNGEE_JAR" && exit 1)
          test -f "$VELOCITY_JAR" || (echo "Missing $VELOCITY_JAR" && exit 1)

          mkdir -p release
          cp "$BUNGEE_JAR" release/
          cp "$VELOCITY_JAR" release/
          (cd release && zip -r "../ProxyChat-${RELEASE_VERSION}.zip" .)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: ProxyChat v${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          body: |
            ## Downloads

            | File | Install on |
            |------|------------|
            | `ProxyChat-Bungee-${{ env.RELEASE_VERSION }}.jar` | Waterfall / BungeeCord `plugins/` folder |
            | `ProxyChat-Velocity-${{ env.RELEASE_VERSION }}.jar` | Velocity `plugins/` folder |
            | `ProxyChat-${{ env.RELEASE_VERSION }}.zip` | Both plugin JARs in one archive |

            Requires **Java 17+** on the proxy. Pick the JAR that matches your proxy software — you do not need both unless you run both proxies.
          files: |
            release/ProxyChat-Bungee-${{ env.RELEASE_VERSION }}.jar
            release/ProxyChat-Velocity-${{ env.RELEASE_VERSION }}.jar
            ProxyChat-${{ env.RELEASE_VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
