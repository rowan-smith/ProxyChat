prefix: "&2ProxyChat » "

toggle-enable-message: "&aToggled on %chat-name%"
toggle-disable-message: "&aToggled off %chat-name%"
ignore-enable-message: "&cIgnored %chat-name%"
ignore-disable-message: "&aUn-ignored %chat-name%"
chat-disabled-message: "&cChat disabled"
command-cooldown-message: "&cCooldown %chat-cooldown%"
console-disabled-message: "&cConsole disabled"

reload-permission: "proxychat.reload"
reload-message: "&aReloaded"

signed-chat-interception: auto

chats:
  legacy:
    chat-name: "Legacy Chat"
    command-name: "legacy"
    permission: "proxychat.legacy"
    command-alias: "L"
    command-prefix: "!"
    use-command-prefix: true
    log-chat-to-console: false
    command-delay: 0
    command-delay-override-permission: "proxychat.legacy.override"
    invalid-args: "&cUsage: /legacy <message>"
    format: "&7%player%: %message%"
    console-format: "&7Console: %message%"
    console-chat-allowed: true
    use-color-in-chat-permission: "proxychat.legacy.color"
    toggleable: false
    ignorable: false
    local: false
    blacklist: []

version: 2
